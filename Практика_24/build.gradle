tasks.register('verifyKotlinDistribution') {
    group = 'verification'
    description = 'Проверяет Kotlin-класс, runtime в installDist и запуск Java-клиента из поставки.'
    dependsOn 'installDist'
    doLast {
        def libraryDirectory = layout.buildDirectory.dir(
                'install/jvm-practice-24/lib').get().asFile
        if (!libraryDirectory.isDirectory()) {
            throw new GradleException("Каталог installDist не найден: ${libraryDirectory}")
        }

        def libraries = libraryDirectory.listFiles()
                .findAll { it.isFile() && it.name.endsWith('.jar') }
                .sort { first, second -> first.name <=> second.name }
        def kotlinRuntime = libraries.findAll {
            it.name.startsWith('kotlin-stdlib') && it.name.endsWith('.jar')
        }
        if (kotlinRuntime.isEmpty()) {
            throw new GradleException('Kotlin runtime отсутствует в installDist/lib')
        }

        def applicationJar = new File(libraryDirectory, tasks.jar.archiveFileName.get())
        new java.util.zip.ZipFile(applicationJar).withCloseable { zip ->
            def classPath = 'ru/npi/kbju/interop/NutritionPlanCaption.class'
            if (zip.getEntry(classPath) == null) {
                throw new GradleException("Kotlin-класс отсутствует в JAR: ${classPath}")
            }
        }

        def javaExecutable = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(25)
        }.get().executablePath.asFile
        def classpath = libraries.collect { it.absolutePath }
                .join(File.pathSeparator)
        def process = new ProcessBuilder(
                javaExecutable.absolutePath,
                '-cp', classpath,
                'ru.npi.kbju.interop.InteropDemo')
                .directory(libraryDirectory.parentFile)
                .redirectErrorStream(true)
                .start()
        def output = process.inputStream.getText('UTF-8')
        def exitValue = process.waitFor()
        if (exitValue != 0) {
            throw new GradleException(
                    "InteropDemo из installDist завершился с кодом ${exitValue}:\n${output}")
        }
        def expectedLines = [
                'План #23: Поддержание рациона [ACTIVE], действует с 2026-10-23',
                'Null-контракт: План питания обязателен'
        ]
        if (output.readLines().findAll { !it.isBlank() } != expectedLines) {
            throw new GradleException("Неожиданный вывод InteropDemo:\n${output}")
        }

        println "Kotlin-класс в JAR: ru/npi/kbju/interop/NutritionPlanCaption.class"
        println "Kotlin runtime в installDist: ${kotlinRuntime*.name.join(', ')}"
        println 'Java-клиент из installDist:'
        println output.trim()
    }
}

check.dependsOn testInterop, verifyKotlinDistribution

def packagedApplicationName = 'KbjuDiary'
def packagedVersion = version.toString()
def projectDirectoryPath = layout.projectDirectory.asFile.absolutePath
def packagePlatform = currentOs.isWindows() ? 'windows' : (currentOs.isMacOsX() ? 'macos' : 'linux')
def packageArchitecture = System.getProperty('os.arch')
def packageModules = [
        'java.base',
        'java.desktop',
        'java.logging',
        'java.management',
        'java.naming',
        'java.net.http',
        'java.scripting',
        'java.sql',
        'java.xml',
        'jdk.crypto.ec',
        'jdk.httpserver',
        'jdk.unsupported'
].join(',')

def appImageDirectory = {
    layout.buildDirectory.dir(currentOs.isMacOsX()
            ? "package/${packagedApplicationName}.app"
            : "package/${packagedApplicationName}").get().asFile
}
def appImageLauncher = { File image ->
    new File(image, currentOs.isWindows()
            ? "${packagedApplicationName}.exe"
            : (currentOs.isMacOsX()
                    ? "Contents/MacOS/${packagedApplicationName}"
                    : "bin/${packagedApplicationName}"))
}
def appImageRuntimeDirectory = { File image ->
    new File(image, currentOs.isMacOsX() ? 'Contents/runtime/Contents/Home' : 'lib/runtime')
}
def appImageApplicationDirectory = { File image ->
    new File(image, currentOs.isMacOsX() ? 'Contents/app' : 'lib/app')
}

tasks.register('analyzeDependencies', Exec) {
    group = 'verification'
    description = 'Печатает модули JDK, найденные jdeps; динамические загрузки проверяются отдельно.'
    dependsOn jar
    doFirst {
        def jdeps = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(25)
        }.get().metadata.installationPath.file('bin/jdeps').asFile
        commandLine jdeps,
                '--multi-release', '25',
                '--ignore-missing-deps',
                '--recursive',
                '--print-module-deps',
                '--module-path', configurations.runtimeClasspath.asPath,
                tasks.jar.archiveFile.get().asFile
    }
}

tasks.register('cleanPackage', Delete) {
    delete layout.buildDirectory.dir('package')
}

tasks.register('packageAppImage', Exec) {
    group = 'distribution'
    description = 'Создаёт app-image для текущих ОС и архитектуры.'
    dependsOn 'cleanPackage', 'installDist'
    doFirst {
        def jpackage = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(25)
        }.get().metadata.installationPath.file('bin/jpackage').asFile
        def input = layout.buildDirectory.dir(
                'install/jvm-practice-24/lib').get().asFile
        commandLine jpackage,
                '--type', 'app-image',
                '--name', packagedApplicationName,
                '--app-version', packagedVersion,
                '--vendor', 'NPI student project',
                '--description', 'Дневник питания КБЖУ',
                '--input', input,
                '--main-jar', tasks.jar.archiveFileName.get(),
                '--main-class', 'ru.npi.kbju.Launcher',
                '--add-modules', packageModules,
                '--java-options', '-Dfile.encoding=UTF-8',
                '--java-options', '--enable-native-access=ALL-UNNAMED',
                '--dest', layout.buildDirectory.dir('package').get().asFile
    }
}

tasks.register('verifyAppImage') {
    group = 'verification'
    description = 'Проверяет структуру, runtime и ресурсы app-image без подмены фактического запуска.'
    dependsOn 'packageAppImage'
    doLast {
        def image = appImageDirectory()
        def launcher = appImageLauncher(image)
        def runtime = appImageRuntimeDirectory(image)
        def appDirectory = appImageApplicationDirectory(image)
        def packagedJar = new File(appDirectory, tasks.jar.archiveFileName.get())

        if (!image.isDirectory()) {
            throw new GradleException("Каталог app-image не найден: ${image}")
        }
        if (!launcher.isFile() || (!currentOs.isWindows() && !launcher.canExecute())) {
            throw new GradleException("Исполняемый launcher не найден: ${launcher}")
        }
        if (!runtime.isDirectory()) {
            throw new GradleException("Встроенная среда Java не найдена: ${runtime}")
        }
        if (!packagedJar.isFile()) {
            throw new GradleException("Основной JAR не найден в образе: ${packagedJar}")
        }

        def requiredResources = [
                'ru/npi/kbju/interop/NutritionPlanCaption.class',
                'ru/npi/kbju/ui/main-view.fxml',
                'ru/npi/kbju/ui/style.css',
                'ru/npi/kbju/release/release-manifest.txt',
                'META-INF/services/ru.npi.kbju.report.NutritionReportPlugin'
        ]
        new java.util.zip.ZipFile(packagedJar).withCloseable { zip ->
            requiredResources.each { path ->
                if (zip.getEntry(path) == null) {
                    throw new GradleException("В JAR образа отсутствует ресурс: ${path}")
                }
            }
        }

        def kotlinRuntime = appDirectory.listFiles().findAll {
            it.isFile() && it.name.startsWith('kotlin-stdlib') && it.name.endsWith('.jar')
        }
        if (kotlinRuntime.isEmpty()) {
            throw new GradleException('Kotlin runtime отсутствует в app-image')
        }

        def forbidden = []
        java.nio.file.Files.walk(image.toPath()).withCloseable { paths ->
            paths.filter { java.nio.file.Files.isRegularFile(it) }.forEach { path ->
                def name = path.fileName.toString().toLowerCase(java.util.Locale.ROOT)
                if (name.endsWith('.db') || name.endsWith('.log')) {
                    forbidden.add(path)
                }
                if (name.endsWith('.cfg')) {
                    def text = java.nio.file.Files.readString(path)
                    if (text.contains(projectDirectoryPath)) {
                        throw new GradleException("В конфигурации образа найден путь исходников: ${path}")
                    }
                }
            }
        }
        if (!forbidden.isEmpty()) {
            throw new GradleException("В app-image попали изменяемые данные: ${forbidden}")
        }

        println "App-image: ${image}"
        println "Launcher: ${launcher}"
        println "Встроенный runtime: ${runtime}"
        println "Основной JAR и ресурсы проверены"
        println "Kotlin runtime: ${kotlinRuntime*.name.join(', ')}"
        println "Изменяемые .db/.log в образе отсутствуют"
    }
}

tasks.register('verifyPackagedLaunch') {
    group = 'verification'
    description = 'Копирует app-image вне проекта, добавляет запись через форму и проверяет повторный запуск.'
    dependsOn 'verifyAppImage'
    doLast {
        def sourceImage = appImageDirectory()
        def cleanRoot = java.nio.file.Files.createTempDirectory('kbju-app-image-acceptance-')
        def dataRoot = java.nio.file.Files.createTempDirectory('kbju-app-image-data-')
        def copiedImage = cleanRoot.resolve(sourceImage.name)

        try {
            java.nio.file.Files.walk(sourceImage.toPath()).withCloseable { paths ->
                paths.forEach { source ->
                    def relative = sourceImage.toPath().relativize(source)
                    def target = copiedImage.resolve(relative)
                    if (java.nio.file.Files.isDirectory(source)) {
                        java.nio.file.Files.createDirectories(target)
                    } else {
                        java.nio.file.Files.createDirectories(target.parent)
                        java.nio.file.Files.copy(
                                source,
                                target,
                                java.nio.file.StandardCopyOption.REPLACE_EXISTING,
                                java.nio.file.StandardCopyOption.COPY_ATTRIBUTES
                        )
                    }
                }
            }

            def launcher = appImageLauncher(copiedImage.toFile())
            def runtime = appImageRuntimeDirectory(copiedImage.toFile())
            def runProbe = { String mode ->
                def process = new ProcessBuilder(
                        launcher.absolutePath,
                        "--data-dir=${dataRoot}",
                        "--package-probe=${mode}")
                        .directory(cleanRoot.toFile())
                        .redirectErrorStream(true)
                        .start()
                if (!process.waitFor(45, java.util.concurrent.TimeUnit.SECONDS)) {
                    process.destroyForcibly()
                    throw new GradleException("Запуск app-image завис в режиме ${mode}")
                }
                def output = process.inputStream.getText('UTF-8')
                if (process.exitValue() != 0) {
                    throw new GradleException(
                            "Запуск app-image завершился с кодом ${process.exitValue()}:\n${output}")
                }
                if (!output.contains("Java runtime: ${runtime.absolutePath}")) {
                    throw new GradleException("Launcher не подтвердил встроенный runtime:\n${output}")
                }
                println "Запуск ${mode}:"
                println output.trim()
                output
            }

            def addOutput = runProbe('add')
            if (!addOutput.contains('запись добавлена через форму')) {
                throw new GradleException('Первый запуск не подтвердил добавление через форму')
            }
            def verifyOutput = runProbe('verify')
            if (!verifyOutput.contains('сохранённая запись найдена')) {
                throw new GradleException('Повторный запуск не подтвердил сохранение записи')
            }

            def database = dataRoot.resolve('data/nutrition-plans.db')
            if (!java.nio.file.Files.isRegularFile(database)) {
                throw new GradleException("SQLite-файл не найден в пользовательском каталоге: ${database}")
            }
            if (database.startsWith(copiedImage)) {
                throw new GradleException('Пользовательская база оказалась внутри app-image')
            }

            println "Копия без исходников: ${copiedImage}"
            println "Данные вне образа: ${database}"
            println "Платформа проверки: ${packagePlatform}/${packageArchitecture}"
        } finally {
            delete cleanRoot.toFile(), dataRoot.toFile()
        }
    }
}

tasks.register('packageAppImageArchive', Tar) {
    group = 'distribution'
    description = 'Создаёт воспроизводимый tar.gz проверенного app-image.'
    dependsOn 'verifyPackagedLaunch'
    compression = Compression.GZIP
    archiveFileName = "${packagedApplicationName}-${packagedVersion}-${packagePlatform}-${packageArchitecture}.tar.gz"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    reproducibleFileOrder = true
    preserveFileTimestamps = false
    from(layout.buildDirectory.dir('package'))
}

tasks.register('verifyDistribution') {
    group = 'verification'
    description = 'Создаёт архив поставки и печатает его SHA-256.'
    dependsOn 'analyzeDependencies', 'packageAppImageArchive'
    doLast {
        def archive = tasks.packageAppImageArchive.archiveFile.get().asFile
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        archive.withInputStream { stream ->
            byte[] buffer = new byte[8192]
            int read
            while ((read = stream.read(buffer)) != -1) {
                digest.update(buffer, 0, read)
            }
        }
        def hash = java.util.HexFormat.of().formatHex(digest.digest())
        def checksum = new File(archive.parentFile, archive.name + '.sha256')
        checksum.setText("${hash}  ${archive.name}\n", 'UTF-8')
        println "Архив app-image: ${archive}"
        println "SHA-256: ${hash}"
        println "Контрольная сумма: ${checksum}"
    }
}

