def serviceDescriptor = 'META-INF/services/ru.npi.kbju.report.NutritionReportPlugin'

tasks.register('verifyJarContents') {
    group = 'verification'
    description = 'Проверяет классы, FXML, CSS и service descriptor в основном JAR.'
    dependsOn jar
    doLast {
        def archive = tasks.jar.archiveFile.get().asFile
        def expected = [
                'ru/npi/kbju/lesson/PluginDemo.class',
                'ru/npi/kbju/report/NutritionReportPlugin.class',
                'ru/npi/kbju/report/PlainNutritionReport.class',
                'ru/npi/kbju/report/CompactNutritionReport.class',
                'ru/npi/kbju/ui/main-view.fxml',
                'ru/npi/kbju/ui/style.css',
                'ru/npi/kbju/release/release-manifest.txt',
                serviceDescriptor
        ]
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            expected.each { path ->
                if (zip.getEntry(path) == null) {
                    throw new GradleException("В JAR отсутствует обязательный элемент: ${path}")
                }
                println "JAR содержит: ${path}"
            }
            def descriptorText = zip.getInputStream(zip.getEntry(serviceDescriptor))
                    .getText('UTF-8')
                    .readLines()
                    .collect { it.trim() }
                    .findAll { !it.isEmpty() && !it.startsWith('#') }
            def expectedProviders = [
                    'ru.npi.kbju.report.PlainNutritionReport',
                    'ru.npi.kbju.report.CompactNutritionReport'
            ]
            if (descriptorText != expectedProviders) {
                throw new GradleException("Неожиданный список поставщиков: ${descriptorText}")
            }
            println "Поставщики в descriptor: ${descriptorText.size()}"
        }
    }
}

tasks.register('descriptorlessJar', Jar) {
    group = 'verification'
    description = 'Создаёт учебную копию JAR без service descriptor.'
    dependsOn jar
    archiveClassifier = 'without-services'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ zipTree(tasks.jar.archiveFile.get().asFile) }) {
        exclude serviceDescriptor
    }
}

tasks.register('verifyMissingProviderFailure') {
    group = 'verification'
    description = 'Подтверждает явный отказ при отсутствии service descriptor.'
    dependsOn descriptorlessJar
    doLast {
        def javaExecutable = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(25)
        }.get().executablePath.asFile
        def archive = tasks.descriptorlessJar.archiveFile.get().asFile
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            if (zip.getEntry(serviceDescriptor) != null) {
                throw new GradleException('Service descriptor не удалён из учебной копии')
            }
            [
                    'ru/npi/kbju/report/PlainNutritionReport.class',
                    'ru/npi/kbju/report/CompactNutritionReport.class'
            ].each { providerClass ->
                if (zip.getEntry(providerClass) == null) {
                    throw new GradleException("В учебной копии потерян класс: ${providerClass}")
                }
            }
        }
        def process = new ProcessBuilder(
                javaExecutable.absolutePath,
                '-cp', archive.absolutePath,
                'ru.npi.kbju.lesson.PluginDemo')
                .redirectErrorStream(true)
                .start()
        def text = process.inputStream.getText('UTF-8')
        def exitValue = process.waitFor()
        if (exitValue == 0) {
            throw new GradleException('Запуск без service descriptor неожиданно завершился успешно')
        }
        if (!text.contains('Поставщики отчётов не найдены')) {
            throw new GradleException("Нет ожидаемой диагностики отсутствия поставщиков:\n${text}")
        }
        println "Ожидаемый отказ подтверждён, код: ${exitValue}"
        println text.trim()
    }
}

check.dependsOn testExtensions, verifyJarContents, verifyMissingProviderFailure

