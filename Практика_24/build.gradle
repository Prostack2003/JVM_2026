tasks.register('verifyReleaseDocumentation') {
    group = 'verification'
    description = 'Проверяет комплект финальной приёмки и пять строк трассируемости.'
    dependsOn jar
    doLast {
        releaseDocuments.each { relative ->
            def file = layout.projectDirectory.file(relative).asFile
            if (!file.isFile() || file.length() == 0) {
                throw new GradleException("Документ выпуска отсутствует или пуст: ${relative}")
            }
        }

        def matrix = layout.projectDirectory.file('docs/traceability-matrix.md').asFile
                .getText('UTF-8')
        (1..5).each { number ->
            def id = String.format('ПР-%02d', number)
            if (!matrix.contains(id) || !matrix.contains("${id} | ПРОЙДЕНО")) {
                throw new GradleException("Матрица не подтверждает сценарий ${id}")
            }
        }

        def manifestEntry = 'ru/npi/kbju/release/release-manifest.txt'
        new java.util.zip.ZipFile(tasks.jar.archiveFile.get().asFile).withCloseable { zip ->
            if (zip.getEntry(manifestEntry) == null) {
                throw new GradleException("В JAR отсутствует ${manifestEntry}")
            }
        }
        println "Документы выпуска: ${releaseDocuments.size()}"
        println 'Пять сценариев имеют статус ПРОЙДЕНО и воспроизводимые доказательства'
    }
}

tasks.register('packageReleaseBundle', Tar) {
    group = 'distribution'
    description = 'Собирает app-image, исходники и документацию финального выпуска.'
    dependsOn 'verifyDistribution', 'verifyReleaseDocumentation'
    compression = Compression.GZIP
    archiveFileName = "${packagedApplicationName}-${packagedVersion}-release-bundle-${packagePlatform}-${packageArchitecture}.tar.gz"
