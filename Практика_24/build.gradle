plugins {
    id 'application'
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.4.10'
}

group = 'ru.npi.kbju'
version = '24.0.0'

repositories {
    mavenCentral()
}

java {
    modularity.inferModulePath = true
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

kotlin {
    jvmToolchain(25)
}

def currentOs = org.gradle.internal.os.OperatingSystem.current()
def javafxOs = currentOs.isWindows() ? 'win' : (currentOs.isMacOsX() ? 'mac' : 'linux')
def javafxArch = System.getProperty('os.arch') in ['aarch64', 'arm64'] ? '-aarch64' : ''
def javafxClassifier = javafxOs + javafxArch
def configuredProjectName = project.name
def configuredDataDirectory = providers.gradleProperty('kbjuDataDir')
        .orElse(layout.projectDirectory.dir('.lesson-data').asFile.absolutePath)
def configuredConfigFile = providers.gradleProperty('kbjuConfig')

dependencies {
    implementation "org.openjfx:javafx-base:25:${javafxClassifier}"
    implementation "org.openjfx:javafx-graphics:25:${javafxClassifier}"
    implementation "org.openjfx:javafx-controls:25:${javafxClassifier}"
    implementation "org.openjfx:javafx-fxml:25:${javafxClassifier}"
    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.20.0'
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.17'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.4'
}

application {
    mainModule = 'ru.npi.kbju.desktop'
    mainClass = 'ru.npi.kbju.Launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all']
}

// Kotlin компилируется первым; для JPMS javac получает его классы как часть того же модуля.
tasks.named('compileJava') {
    doFirst {
        options.compilerArgs += [
                '--patch-module',
                "ru.npi.kbju.desktop=${tasks.compileKotlin.destinationDirectory.get().asFile.absolutePath}"
        ]
    }
}

tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
    systemProperty 'file.encoding', 'UTF-8'
    jvmArgs '--enable-native-access=javafx.graphics,org.xerial.sqlitejdbc,ALL-UNNAMED'
}

tasks.withType(Test).configureEach {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    maxParallelForks = 1
}

