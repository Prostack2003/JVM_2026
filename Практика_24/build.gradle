    }
}

tasks.register('verifyReleaseBundle') {
    group = 'verification'
    description = 'Проверяет состав финального архива и создаёт SHA-256.'
    dependsOn 'packageReleaseBundle'
    doLast {
        def archive = tasks.packageReleaseBundle.archiveFile.get().asFile
        if (!archive.isFile() || archive.length() == 0) {
            throw new GradleException("Архив выпуска не создан: ${archive}")
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        archive.withInputStream { stream ->
            byte[] buffer = new byte[8192]
            int read
            while ((read = stream.read(buffer)) != -1) {
                digest.update(buffer, 0, read)
            }
        }
        def hash = java.util.HexFormat.of().formatHex(digest.digest())
        def checksum = new File(archive.parentFile, archive.name + '.sha256')
        checksum.setText("${hash}  ${archive.name}\n", 'UTF-8')
        println "Финальный архив: ${archive}"
        println "SHA-256: ${hash}"
        println "Контрольная сумма: ${checksum}"
    }
}

tasks.register('releaseAcceptance') {
    group = 'verification'
    description = 'Выполняет финальную регрессию, два отказных показа и собирает выпуск.'
    dependsOn 'check', 'runOfflineCatalogAcceptance', 'runBackupRecoveryAcceptance',
